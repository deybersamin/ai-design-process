<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Claude in our design process</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* ---------- WTW brand tokens (2026 palette) ---------- */
:root{
  --uv-950:#1E0034; --uv-850:#35035A; --uv-750:#521380; --uv-600:#7F35B2; --uv-275:#D0A8EC; --uv-50:#F9F2FE;
  --gm-50:#F2F3F4; --gm-125:#E0E1E3; --gm-250:#BEBFC1; --gm-600:#5C5D5F;
  --fireworks:#D124B8; --coral:#F75784; --stratosphere:#327FEF; --infinity:#51E0D0; --submarine:#FFC144; --mandarin:#FF9434;
  --error:#B2242E; --success:#1F856A; --warning-50:#FFF3D9; --success-50:#E9F7F2; --error-50:#FFF0F0;

  --bg:#FFFFFF; --bg-alt:var(--gm-50); --surface:#FFFFFF;
  --text:#000000; --text-2:var(--gm-600); --head:var(--uv-750);
  --line:var(--gm-125); --line-strong:var(--gm-250);
  --accent:var(--uv-750); --accent-soft:var(--uv-50);
  --focus:var(--stratosphere);

  --pill-bg:var(--gm-50); --pill-text:#000; --pill-line:var(--gm-250);
  --skill-bg:var(--uv-50); --skill-text:var(--uv-750); --skill-line:var(--uv-275);
  --opus-bg:var(--uv-850); --opus-text:#fff;
  --sonnet-bg:var(--uv-600); --sonnet-text:#fff;
  --haiku-bg:var(--gm-125); --haiku-text:#000;
  --dot-line:var(--uv-750); --dot-on:var(--uv-750);

  /* diagram */
  --lane-a:#FFFFFF; --lane-b:var(--gm-50); --lane-line:var(--gm-125);
  --gutter:var(--gm-125); --gutter-text:#000;
  --n-po-fill:#FFFFFF; --n-po-stroke:var(--gm-600); --n-po-text:#000;
  --n-design-fill:var(--uv-50); --n-design-stroke:var(--uv-600); --n-design-text:#000;
  --n-dev-fill:var(--uv-850); --n-dev-stroke:var(--uv-850); --n-dev-text:#fff;
  --n-dec-fill:var(--warning-50); --n-dec-stroke:#C48A00; --n-dec-text:#000;
  --n-end-fill:var(--success-50); --n-end-stroke:var(--success); --n-end-text:#000;
  --chip-fill:#FFFFFF; --chip-stroke:var(--gm-250); --chip-text:#000;
  --chip-dev-fill:var(--uv-600); --chip-dev-stroke:var(--uv-275); --chip-dev-text:#fff;
  --edge:#3b3b3d; --edge-yes:var(--success); --edge-no:var(--error);
  --label-bg:rgba(255,255,255,.92);

  --serif:"Times New Roman",Times,serif;
  --sans:Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16002A; --bg-alt:#1E0034; --surface:#26083F;
    --text:#FFFFFF; --text-2:#CFC6D8; --head:var(--uv-275);
    --line:#3A1F57; --line-strong:#56397A;
    --accent:var(--uv-275); --accent-soft:#2D0B4A;
    --pill-bg:#2D0B4A; --pill-text:#fff; --pill-line:#56397A;
    --skill-bg:#35035A; --skill-text:#fff; --skill-line:var(--uv-600);
    --haiku-bg:#56397A; --haiku-text:#fff;
    --dot-line:var(--uv-275); --dot-on:var(--uv-275);

    --lane-a:#1A0030; --lane-b:#220A3A; --lane-line:#3A1F57;
    --gutter:#35035A; --gutter-text:#fff;
    --n-po-fill:#2B2B30; --n-po-stroke:#BEBFC1; --n-po-text:#fff;
    --n-design-fill:#3E0F66; --n-design-stroke:var(--uv-275); --n-design-text:#fff;
    --n-dev-fill:var(--uv-600); --n-dev-stroke:var(--uv-275); --n-dev-text:#fff;
    --n-dec-fill:#FFF3D9; --n-dec-stroke:var(--submarine); --n-dec-text:#000;
    --n-end-fill:#E9F7F2; --n-end-stroke:#4FCDA6; --n-end-text:#000;
    --chip-fill:#26083F; --chip-stroke:var(--uv-275); --chip-text:#fff;
    --chip-dev-fill:var(--uv-850); --chip-dev-stroke:var(--uv-275); --chip-dev-text:#fff;
    --edge:#E0D6EA; --edge-yes:#4FCDA6; --edge-no:#FF8D96;
    --label-bg:rgba(22,0,42,.9);
  }
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;margin:0;color:var(--head);line-height:1.12}
h2{font-size:clamp(30px,3.6vw,44px);letter-spacing:-.01em}
h3{font-size:22px}
h4{font-family:var(--sans);font-size:14px;font-weight:700;color:var(--text);margin:0 0 4px}
p{margin:0 0 12px;max-width:68ch}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.wrap-wide{max-width:1560px;margin:0 auto;padding:0 28px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--text-2)}
code,.mono{font-family:Consolas,"Courier New",monospace;font-size:.92em}

/* ---------- top nav ---------- */
.topnav{position:sticky;top:0;z-index:50;background:var(--uv-850);color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
.topnav .wrap-wide{display:flex;align-items:center;gap:28px;height:56px}
.brand{font-family:var(--serif);font-size:19px;font-weight:700;color:#fff;text-decoration:none;white-space:nowrap}
.navlinks{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{color:#fff;text-decoration:none;font-size:14px;padding:8px 12px;border-radius:4px;white-space:nowrap;border-bottom:2px solid transparent}
.navlinks a:hover{background:rgba(255,255,255,.1)}
.navlinks a[aria-current="true"]{border-bottom-color:var(--uv-275);background:rgba(255,255,255,.08)}

/* ---------- hero ---------- */
.hero{background:var(--uv-850);color:#fff;position:relative;overflow:hidden}
@media (prefers-color-scheme:dark){.hero{background:var(--uv-950)}}
.hero .motif{position:absolute;right:-60px;top:-40px;width:760px;height:520px;opacity:.9;pointer-events:none}
.hero .wrap-wide{position:relative;padding-top:72px;padding-bottom:0}
.hero h1{color:#fff;font-size:clamp(44px,6.4vw,88px);letter-spacing:-.02em;max-width:12ch}
.hero .lede{font-size:19px;line-height:1.5;max-width:60ch;margin:24px 0 8px;color:#fff}
.hero .own{font-family:var(--serif);font-size:22px;max-width:44ch;margin:20px 0 0;color:var(--uv-275);line-height:1.3}
.hero .checked{font-size:13px;color:var(--uv-275);margin:28px 0 0;max-width:none}
.rail{list-style:none;display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin:48px 0 0;padding:0;border-top:1px solid rgba(255,255,255,.22)}
.rail li{border-right:1px solid rgba(255,255,255,.14)}
.rail li:last-child{border-right:0}
.rail a{display:block;padding:18px 18px 22px;color:#fff;text-decoration:none;height:100%}
.rail a:hover{background:rgba(255,255,255,.07)}
.rail .num{display:block;font-family:var(--serif);font-size:34px;line-height:1;color:var(--uv-275)}
.rail .nm{display:block;font-family:var(--serif);font-size:20px;margin:8px 0 4px;font-weight:700}
.rail .ow{display:block;font-size:13px;color:#E8DAF5;line-height:1.4}
.rail .once{font-size:12px;color:var(--uv-275)}

/* ---------- sections ---------- */
section.block{padding:84px 0}
section.alt{background:var(--bg-alt)}
.sec-head{margin-bottom:36px}
.sec-head p{font-size:18px;margin-top:14px;color:var(--text)}
.sec-head .sub{color:var(--text-2);font-size:16px}

/* ---------- flow diagram ---------- */
.legend{display:flex;flex-wrap:wrap;gap:10px 24px;margin:0 0 16px;padding:0;list-style:none;font-size:14px;align-items:center}
.legend li{display:flex;align-items:center;gap:8px}
.sw{display:inline-block;width:22px;height:14px;border-radius:3px;border:2px solid}
.sw.po{background:var(--n-po-fill);border-color:var(--n-po-stroke)}
.sw.design{background:var(--n-design-fill);border-color:var(--n-design-stroke)}
.sw.dev{background:var(--n-dev-fill);border-color:var(--n-dev-stroke)}
.sw.dec{background:var(--n-dec-fill);border-color:var(--n-dec-stroke);transform:rotate(45deg) scale(.8);width:14px}
.ln{display:inline-block;width:26px;height:0;border-top:3px solid}
.ln.yes{border-color:var(--edge-yes)}
.ln.no{border-color:var(--edge-no)}
.ln.n{border-color:var(--edge)}
.hint{margin-left:auto;color:var(--text-2)}
.flow-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--lane-a)}
.flow{display:block;width:100%;min-width:1180px;height:auto}
.flow text{font-family:var(--sans)}
.lane-a{fill:var(--lane-a)} .lane-b{fill:var(--lane-b)}
.lane-sep{stroke:var(--lane-line);stroke-width:1.5}
.gutter{fill:var(--gutter)}
.lane-label{fill:var(--gutter-text);font-size:14px;font-weight:700;letter-spacing:.02em}
.node{cursor:pointer;outline:none;transition:opacity .15s}
.node .shape{stroke-width:2;transition:stroke-width .12s}
.node:hover .shape{stroke-width:3}
.node:focus-visible .shape,.node.is-active .shape{stroke:var(--focus);stroke-width:4}
.node text.t{font-size:14px;font-weight:600}
.n-po .shape{fill:var(--n-po-fill);stroke:var(--n-po-stroke)} .n-po text.t{fill:var(--n-po-text)}
.n-design .shape{fill:var(--n-design-fill);stroke:var(--n-design-stroke)} .n-design text.t{fill:var(--n-design-text)}
.n-dev .shape{fill:var(--n-dev-fill);stroke:var(--n-dev-stroke)} .n-dev text.t{fill:var(--n-dev-text)}
.n-dec .shape{fill:var(--n-dec-fill);stroke:var(--n-dec-stroke)} .n-dec text.t{fill:var(--n-dec-text)}
.n-end .shape{fill:var(--n-end-fill);stroke:var(--n-end-stroke)} .n-end text.t{fill:var(--n-end-text)}
.chip rect{fill:var(--chip-fill);stroke:var(--chip-stroke);stroke-width:1}
.chip text{fill:var(--chip-text);font-size:11px;font-weight:600}
.n-dev .chip rect{fill:var(--chip-dev-fill);stroke:var(--chip-dev-stroke)}
.n-dev .chip text{fill:var(--chip-dev-text)}
.edge{fill:none;stroke-width:2.2;stroke:var(--edge);transition:opacity .15s}
.edge.yes{stroke:var(--edge-yes)} .edge.no{stroke:var(--edge-no)}
.mk-n{fill:var(--edge)} .mk-yes{fill:var(--edge-yes)} .mk-no{fill:var(--edge-no)}
.elabel{font-size:13px;font-weight:700;transition:opacity .15s}
.elabel.yes{fill:var(--edge-yes)} .elabel.no{fill:var(--edge-no)}
.flow.has-sel .node:not(.is-active):not(.is-linked){opacity:.3}
.flow.has-sel .edge:not(.is-linked),.flow.has-sel .elabel:not(.is-linked){opacity:.15}

.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;margin-top:20px;padding:28px 32px;border:1px solid var(--line);border-left:6px solid var(--uv-600);border-radius:6px;background:var(--surface);min-height:190px}
.detail h3{font-size:26px;margin-bottom:4px}
.detail .owner{color:var(--text-2);font-size:14px;margin-bottom:12px}
.detail .side h4{margin-top:14px}
.detail .side h4:first-child{margin-top:0}
.detail ul{margin:0;padding-left:18px;font-size:14px}
.stepchips{display:flex;flex-wrap:wrap;gap:6px}
.stepchips a{display:inline-block;padding:3px 10px;border:1px solid var(--skill-line);background:var(--skill-bg);color:var(--skill-text);border-radius:999px;font-size:13px;font-weight:700;text-decoration:none}
.stepchips a:hover{text-decoration:underline}

/* ---------- reference tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:2px solid var(--line-strong);margin-bottom:28px}
.tabs button{font:inherit;font-size:15px;font-weight:700;color:var(--text-2);background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:12px 18px;cursor:pointer}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--uv-600)}
.panel[hidden]{display:none}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px}
.cols.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.item h4{font-size:16px;margin-bottom:6px}
.item p{font-size:15px}
.item+.item{margin-top:0}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.plist li:first-child{border-top:0}
.plist p{margin:0;font-size:15px}
ol.numbered{margin:0;padding-left:22px;max-width:76ch}
ol.numbered li{padding:6px 0 6px 6px}
ol.numbered li::marker{font-family:var(--serif);font-weight:700;color:var(--accent);font-size:1.15em}
.rule{margin-top:28px;padding:18px 22px;background:var(--accent-soft);border-left:6px solid var(--uv-600);border-radius:4px;max-width:78ch}
.rule b{display:block;margin-bottom:4px}

/* ---------- pills ---------- */
.tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--pill-bg);color:var(--pill-text);border:1px solid var(--pill-line);white-space:nowrap}
.pill.skill{background:var(--skill-bg);color:var(--skill-text);border-color:var(--skill-line);font-family:Consolas,"Courier New",monospace;font-weight:700}
.pill.opus{background:var(--opus-bg);color:var(--opus-text);border-color:var(--opus-bg)}
.pill.sonnet{background:var(--sonnet-bg);color:var(--sonnet-text);border-color:var(--sonnet-bg)}
.pill.haiku{background:var(--haiku-bg);color:var(--haiku-text);border-color:var(--haiku-bg)}
.pill.fable{background:var(--pill-bg);color:var(--text-2);border-style:dashed}
.effort{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:4px 12px 4px 10px;border:1px solid var(--pill-line);border-radius:999px;background:var(--pill-bg);white-space:nowrap}
.effort i{display:block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dot-line)}
.effort i.on{background:var(--dot-on)}
.effort b{margin-left:4px;font-weight:700}

/* ---------- figjam embed ---------- */
.embed{position:relative;width:100%;aspect-ratio:16/9;min-height:360px;background:var(--surface);border-radius:6px;overflow:hidden}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ---------- foundations ---------- */
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:64px}
.setup .tags{margin-top:18px}
.defs{margin:0;padding:0;list-style:none}
.defs li{padding:18px 0;border-top:1px solid var(--line-strong)}
.defs li:first-child{border-top:0;padding-top:0}
.defs b{display:block;font-size:17px;margin-bottom:4px}
.defs p{margin:0;font-size:15px}

/* ---------- phases ---------- */
.phase{padding:0}
.phase-head{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:end;padding:60px 0 28px;border-bottom:3px solid var(--uv-850)}
@media (prefers-color-scheme:dark){.phase-head{border-bottom-color:var(--uv-600)}}
.phase-head .big{font-family:var(--serif);font-size:clamp(64px,9vw,120px);line-height:.85;font-weight:700;color:var(--uv-600)}
.phase-head h2{margin-bottom:6px}
.phase-head p{margin:0;font-size:18px}
.owner-tag{font-size:14px;font-weight:700;padding:8px 14px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);align-self:end;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:76px minmax(0,1fr);gap:20px;padding:32px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .n{font-family:var(--serif);font-size:34px;font-weight:700;color:var(--uv-600);line-height:1}
.step h3{margin-bottom:6px}
.step .short{font-size:17px;margin-bottom:14px}
.step details{margin-top:16px}
.step summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--accent);padding:4px 0;list-style:none}
.step summary::-webkit-details-marker{display:none}
.step summary::before{content:"+";display:inline-block;width:18px;font-weight:700}
.step details[open] summary::before{content:"\2212"}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:10px}
.two-col p{font-size:15px;margin:0}
.loop{margin-top:14px;font-size:14px;padding:8px 12px;border-left:4px solid var(--edge-no);background:var(--error-50);color:#000;max-width:68ch;border-radius:0 4px 4px 0}
@media (prefers-color-scheme:dark){.loop{background:#3A1020;color:#fff}}
.toolbar{display:flex;justify-content:flex-end;gap:10px;padding:18px 0 0}
.toolbar button{font:inherit;font-size:14px;font-weight:700;color:var(--accent);background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:8px 14px;cursor:pointer}
.toolbar button:hover{background:var(--accent-soft)}
.step:target{background:var(--accent-soft);box-shadow:-20px 0 0 var(--accent-soft),20px 0 0 var(--accent-soft)}

/* ---------- automation ---------- */
.auto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
.auto .col{padding-top:16px;border-top:4px solid var(--uv-600)}
.auto h3{font-size:22px;margin-bottom:14px}
.auto .item{margin-bottom:16px}
.skillrow{padding:12px 0;border-top:1px solid var(--line)}
.skillrow p{margin:8px 0 0;font-size:14px}

/* ---------- measure / decisions ---------- */
.two-panels{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.panel-card{padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.panel-card.dark{background:var(--uv-850);color:#fff;border-color:var(--uv-850)}
.panel-card.dark h2,.panel-card.dark h3{color:#fff}
.panel-card.dark .muted{color:var(--uv-275)}
.panel-card ul{margin:0;padding-left:20px}
.panel-card li{padding:4px 0}
.panel-card .item{margin-bottom:14px}
footer{background:var(--uv-850);color:#E8DAF5;padding:36px 0;font-size:14px}
footer a{color:#fff}
@media (prefers-color-scheme:dark){footer{background:var(--uv-950)}}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .rail{grid-template-columns:repeat(3,1fr)}
  .rail li{border-bottom:1px solid rgba(255,255,255,.14)}
  .auto{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .wrap,.wrap-wide{padding:0 18px}
  section.block{padding:60px 0}
  .detail,.setup,.two-panels,.two-col,.cols,.cols.two,.auto{grid-template-columns:1fr}
  .detail{padding:22px}
  .phase-head{grid-template-columns:1fr;gap:12px}
  .step{grid-template-columns:1fr;gap:6px}
  .plist li{grid-template-columns:1fr;gap:6px}
  .rail{grid-template-columns:repeat(2,1fr)}
  .hero .motif{opacity:.35}
  .hint{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}

/* ---------- lock screen ---------- */
#lock{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--uv-850);color:#fff;position:relative;overflow:hidden}
@media (prefers-color-scheme:dark){#lock{background:var(--uv-950)}}
#lock .motif{position:absolute;right:-80px;bottom:-60px;width:760px;height:520px;opacity:.7;pointer-events:none}
#lock .box{position:relative;width:100%;max-width:440px}
#lock h1{color:#fff;font-size:clamp(34px,6vw,52px);letter-spacing:-.02em;margin-bottom:12px}
#lock p{color:#E8DAF5;margin:0 0 24px}
#lock label{display:block;font-weight:700;margin-bottom:6px}
#lock .row{display:flex;gap:10px}
#lock input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--uv-275);border-radius:4px;background:#fff;color:#000}
#lock button{font:inherit;font-size:16px;font-weight:700;padding:12px 22px;border:2px solid #fff;border-radius:4px;background:#fff;color:var(--uv-850);cursor:pointer}
#lock button:hover{background:var(--uv-50)}
#lock button[disabled]{opacity:.6;cursor:progress}
#lock .err{min-height:24px;margin:12px 0 0;color:#FFD3D6;font-weight:700}
</style>
</head>
<body>
<div id="lock">
  <svg class="motif" viewBox="0 0 760 520" aria-hidden="true" fill="none" stroke-linecap="round">
    <path d="M20 470 C 180 470, 220 250, 380 230 S 600 160, 760 40" stroke="#D0A8EC" stroke-width="2" opacity=".75"/>
